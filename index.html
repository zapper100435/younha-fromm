<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<title>윤하 프롬 아카이브</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <button class="icon-btn menu-btn" id="menuBtn" aria-label="월 목록 열기">
    <svg viewBox="0 0 24 24" width="20" height="20"><path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
  </button>
  <a class="brand" href="#/">
    <span class="brand-mark" id="brandMark"></span>
    <span class="brand-text"><strong id="brandName">프롬</strong><small>아카이브</small></span>
  </a>
  <nav class="tabs" id="tabs">
    <a href="#/" data-view="home">홈</a>
    <a href="#/chat" data-view="chat">대화</a>
    <a href="#/gallery" data-view="gallery">사진·영상</a>
    <a href="#/voice" data-view="voice">음성</a>
  </nav>
  <form class="search" id="searchForm" role="search">
    <svg viewBox="0 0 24 24" width="16" height="16"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="M20 20l-4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    <input id="searchInput" type="search" placeholder="메시지 검색" autocomplete="off">
  </form>
  <button class="icon-btn" id="themeBtn" aria-label="화면 테마 바꾸기">
    <svg viewBox="0 0 24 24" width="18" height="18"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" fill="currentColor"/></svg>
  </button>
</header>

<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="scrim" id="scrim"></div>
  <main id="main" tabindex="-1"></main>
</div>

<div class="lightbox" id="lightbox" hidden>
  <button class="lb-close icon-btn" id="lbClose" aria-label="닫기">✕</button>
  <button class="lb-nav lb-prev icon-btn" id="lbPrev" aria-label="이전">‹</button>
  <figure class="lb-stage" id="lbStage"></figure>
  <button class="lb-nav lb-next icon-btn" id="lbNext" aria-label="다음">›</button>
  <div class="lb-caption" id="lbCaption"></div>
</div>

<script src="config.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
